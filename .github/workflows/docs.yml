name: Deploy Docs to GitHub Pages

on:
  # A push to main builds this site and publishes it. The build here is not
  # the DocC build `make docs` and CI's Docs job run: only this one passes
  # --transform-for-static-hosting and a hosting base path, so only this one
  # produces something a browser can serve.
  #
  # There was a `release: published` trigger as well, and it could never have
  # worked. A release run's ref is the tag, and the `github-pages` environment
  # admits only the branch `main`, so both releases that reached it -- v0.2.4
  # and v0.3.0 -- were refused with "Tag ... is not allowed to deploy to
  # github-pages due to environment protection rules". It also shared the
  # concurrency group below: at v0.3.0 the release was published nine seconds
  # after the release commit landed, so its run displaced the push run already
  # queued and then failed the rule itself. Under the guard that used to sit on
  # the deploy job that push would only have built, so nothing was lost that
  # day -- but between the two, nothing had published the site since a
  # hand-dispatched run on 2026-09-09. Publishing from main is what the
  # environment already permits.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Not cancel-in-progress, which is GitHub's own advice for a Pages workflow:
  # a deployment that has started should be allowed to finish. It is not that
  # cancelling would strand it -- `deploy-pages` handles SIGTERM by cancelling
  # the deployment it created -- but that a half-finished publish buys nothing
  # when the newer run is about to supersede it anyway. Note the setting only
  # governs runs already in flight; a run merely *queued* in this group is
  # cancelled by a newer one regardless, which is how the release run displaced
  # a push above.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build static DocC for both modules
        run: |
          mkdir -p site
          for target in GGChatCore GGChatUI; do
            swift package --allow-writing-to-directory site generate-documentation \
              --target "$target" --warnings-as-errors \
              --transform-for-static-hosting --hosting-base-path "ggchat/$target" \
              --output-path "site/$target"
          done
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>ggchat docs</title>
          <p><a href="GGChatCore/documentation/ggchatcore/">GGChatCore</a> ·
             <a href="GGChatUI/documentation/ggchatui/">GGChatUI</a></p>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # A push used to build the site and stop there, for two reasons its
    # comment said were each enough on their own. Both have since been
    # answered: GitHub Pages was not enabled on this repository, and now is
    # (`gh api repos/mmogr/ggchat/pages` answers, and the site serves); and
    # publishing every commit on main was left as a decision for whoever
    # enabled it, which was taken on 2026-09-17. So the guard is gone and main
    # publishes on push, which is also the only ref the `github-pages`
    # environment admits.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
