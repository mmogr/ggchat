name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Check formatting
        run: make fmt-check

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install linters
        run: brew install swiftlint actionlint
      - name: Lint Swift and workflows
        run: make lint

  boundaries:
    name: Check Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check module boundaries
        run: make boundaries

  enforcement:
    name: Enforce Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Glass sites
        run: scripts/check_glass_sites.sh
      - name: No hand-drawn glass
        run: scripts/check_no_hand_drawn_glass.sh
      - name: Time is an argument
        run: scripts/check_time_is_an_argument.sh
      - name: No print
        run: scripts/check_no_print.sh
      - name: No credential in a log call
        run: scripts/check_log_calls.sh
      - name: File size
        run: scripts/check_file_size.sh
      - name: README claims name their tests
        run: scripts/check_readme_claims.sh

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build the package with warnings as errors
        run: make build
      - name: Build the app for macOS and the iOS simulator
        if: hashFiles('App/ggchat.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          # Ad-hoc signing, not none: an unsigned iOS app has no Keychain
          # access, and the app keeps every credential there.
          # Warnings-as-errors is set on the app target in App/project.yml, not
          # here: on the command line it would also apply to the package
          # dependencies, and swift-markdown compiles with warnings suppressed.
          xcodebuild build -project App/ggchat.xcodeproj -scheme ggchat \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES -quiet
          xcodebuild build -project App/ggchat.xcodeproj -scheme ggchat \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES -quiet

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Lockfile guard
        run: |
          swift package resolve
          git diff --exit-code Package.resolved
      - name: Run tests with coverage
        run: |
          swift test --parallel --enable-code-coverage --xunit-output test-results.xml
      - name: Export coverage
        run: |
          profdata="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
          binary=.build/debug/ggchatPackageTests.xctest/Contents/MacOS/ggchatPackageTests
          xcrun llvm-cov export -format=lcov -instr-profile "$profdata" "$binary" \
            -ignore-filename-regex='\.build|Tests/' > coverage.lcov
          xcrun llvm-cov report -instr-profile "$profdata" "$binary" \
            -ignore-filename-regex='\.build|Tests/' | tee coverage-summary.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results*.xml
            coverage.lcov
            coverage-summary.txt

  uitest:
    name: UI Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Pick a booted iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b || true
      - name: Drive the first-run flow on a simulator
        run: |
          set -o pipefail
          xcodebuild test -project App/ggchat.xcodeproj -scheme ggchat \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath uitest.xcresult \
            -only-testing:ggchatUITests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES -quiet
      - name: Say which tests ran, so a skip cannot pass for a pass
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path uitest.xcresult --format json \
            | python3 -c "
          import json, sys
          def walk(nodes):
              for n in nodes:
                  if n.get('nodeType') == 'Test Case':
                      print(f\"{n.get('result')}\t{n.get('name')}\")
                  walk(n.get('children', []))
          walk(json.load(sys.stdin).get('testNodes', []))
          "
      - name: Upload the screenshots it took
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: uitest.xcresult

  unused:
    name: Unused Code
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install periphery
        run: brew install periphery
      - name: Scan
        run: make unused

  docs:
    name: Docs
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build DocC with warnings as errors
        run: make docs
