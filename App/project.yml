# xcodegen spec for the one thin app target. Everything else lives in the
# package at the repo root. Regenerate with `make project`.
name: ggchat
options:
  bundleIdPrefix: com.mattogrady
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ggchat-package:
    path: ..
targets:
  ggchatUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ggchatUITests
    dependencies:
      - target: ggchat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattogrady.ggchat.uitests
        PRODUCT_NAME: ggchatUITests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: ggchat
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  ggchat:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ggchat
    dependencies:
      - package: ggchat-package
        product: GGChatUI
    configFiles:
      Debug: ../Config/Version.xcconfig
      Release: ../Config/Version.xcconfig
    info:
      path: ggchat/Info.plist
      properties:
        CFBundleDisplayName: ggchat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: ggchat uses the camera to scan a modelpipe ticket. Nothing is stored or sent.
        NSLocalNetworkUsageDescription: ggchat talks to model servers on your local network when you add one by address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattogrady.ggchat
        PRODUCT_NAME: ggchat
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ggchat/ggchat-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ggchat/ggchat-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ggchat/ggchat-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
schemes:
  ggchat:
    build:
      targets:
        ggchat: all
        ggchatUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ggchatUITests
    archive:
      config: Release
