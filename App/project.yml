# xcodegen spec for the one thin app target. Everything else lives in the
# package at the repo root. Regenerate with `make project`.
name: ggchat
options:
  bundleIdPrefix: com.mattogrady
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ggchat-package:
    path: ..
targets:
  ggchatUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ggchatUITests
    dependencies:
      - target: ggchat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattogrady.ggchat.uitests
        PRODUCT_NAME: ggchatUITests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: ggchat
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  ggchat:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ggchat
    dependencies:
      - package: ggchat-package
        product: GGChatUI
    configFiles:
      Debug: ../Config/Version.xcconfig
      Release: ../Config/Version.xcconfig
    info:
      path: ggchat/Info.plist
      properties:
        CFBundleDisplayName: ggchat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: ggchat uses the camera to scan a modelpipe ticket. Nothing is stored or sent.
        NSLocalNetworkUsageDescription: ggchat talks to model servers on your local network when you add one by address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattogrady.ggchat
        PRODUCT_NAME: ggchat
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Apple silicon only, because modelpipe-ffi is. Its xcframework ships
        # three arm64 slices and no x86_64: an Intel Mac app and an Intel Mac
        # running the simulator were dropped there deliberately, and a
        # consumer has to agree or the link fails.
        #
        # It has to be said here rather than left to the default. `ARCHS`
        # otherwise resolves to every standard architecture for the SDK, so
        # the macOS build asks for x86_64, finds no such slice, and fails with
        # a page of missing `_uniffi_modelpipe_ffi_fn_*` symbols under a note
        # about a framework that "may still be link-compatible".
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        # Committed rather than set in Xcode, because `make project`
        # regenerates this project from this file: a team chosen in the
        # Signing & Capabilities tab survives exactly until the next
        # `xcodegen generate`, and then the build fails asking for one again
        # in a way that reads as intermittent. A Team ID is not a secret --
        # it is in every distributed app bundle -- so it lives here.
        DEVELOPMENT_TEAM: G6QCW84LSM
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ggchat/ggchat-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ggchat/ggchat-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ggchat/ggchat-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
schemes:
  ggchat:
    build:
      targets:
        ggchat: all
        ggchatUITests: [test]
    # Release, so that pressing Run gives the app that dials rather than the
    # one that mocks. `PipeConnectorFactory` returns `MockPipeConnector` in
    # DEBUG, and that mock accepts a real ticket, walks its pill to "Direct"
    # and answers with canned replies -- which on a phone is indistinguishable
    # from the thing working, and was very nearly recorded as a passing
    # acceptance test.
    #
    # This has to agree with the generated scheme or the setting is a trap
    # rather than a default: the scheme is committed, and `make project`
    # rewrites it from here. It said Debug while the scheme said Release, so
    # the next regeneration would have put the mock back with no diff anyone
    # would read as meaning that.
    #
    # The DEBUG affordances -- "Add mock provider", "Force closed" -- are still
    # a scheme edit away for whoever wants to work on the UI without a machine
    # to dial, and `make uitest` is unaffected: the Test action stays Debug.
    run:
      config: Release
    test:
      config: Debug
      # Without this the four xcodebuild UI-test legs instrument nothing:
      # they walk every view in the app and `xccov` answers "No coverage
      # data in result bundle". With it the result bundle CI already uploads
      # carries the walk's coverage. The README badge is computed from the
      # package run's lcov and is unaffected either way.
      gatherCoverageData: true
      targets:
        - ggchatUITests
    archive:
      config: Release
